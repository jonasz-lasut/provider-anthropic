                        (1 to 176400). The API default is 3600.
                      format: int64
                      maximum: 176400
                      minimum: 1
                      type: integer
                    name:
                      description: |-
                        Required: Name is a slug (lowercase, digits, hyphens), unique within
                        the organization; a duplicate returns 409.
                      pattern: ^[a-z0-9][a-z0-9-]*$
                      type: string
                  type: object
                managementPolicies:
