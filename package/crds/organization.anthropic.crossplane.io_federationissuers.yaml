                    jwksPollingDisabledAt:
                      description: JWKSPollingDisabledAt is set when polling has been disabled.
                      type: string
                    maxJwtLifetimeSeconds:
                      description: MaxJWTLifetimeSeconds is the observed assertion lifetime bound.
                      format: int64
                      type: integer
                    name:
                      description: Name is the observed slug.
                      type: string
                    pollStatus:
                      description: PollStatus reports the JWKS polling state.
                      properties:
                        consecutiveFailures:
                          description: ConsecutiveFailures counts failed JWKS fetches in a row.
                          format: int64
                          type: integer
                        lastFetchedAt:
                          description: LastFetchedAt is the RFC 3339 timestamp of the last successful fetch.
