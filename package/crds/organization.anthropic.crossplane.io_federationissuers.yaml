                        nextPollAt:
                          description: NextPollAt is the RFC 3339 timestamp of the next scheduled fetch.
                          type: string
                      type: object
                    updatedAt:
                      description: UpdatedAt is the RFC 3339 timestamp of the last modification.
                      type: string
                    updatedByActorId:
                      description: UpdatedByActorID identifies who last modified the issuer.
                      type: string
                  type: object
                conditions:
                  description: Conditions of the resource.
                  items:
                    description: A Condition that may apply to a resource.
                    properties:
