                      description: ArchivedAt is set when the issuer has been archived.
                      type: string
                    checkJti:
                      description: CheckJTI is the observed replay-protection setting.
                      type: boolean
                    createdAt:
                      description: CreatedAt is the RFC 3339 timestamp when the issuer was created.
                      type: string
                    createdByActorId:
                      description: CreatedByActorID identifies who created the issuer.
                      type: string
                    id:
                      description: |-
                        ID is the Anthropic-assigned issuer identifier (fdis_...). Also stored
                        in the external-name annotation, which the reconciler uses as the
                        primary key.
                      type: string
                    issuerUrl:
                      description: IssuerURL is the observed iss value.
                      type: string
                    jwks:
                      description: JWKS is the observed key source configuration.
                      properties:
                        caCertPem:
                          description: |-
                            CACertPEM is an optional custom CA for TLS verification of the JWKS
                            fetch (discovery, explicit_url).
                          type: string
                        discoveryBase:
                          description: |-
                            DiscoveryBase overrides the discovery URL when it differs from the
                            issuer URL (discovery).
                          type: string
                        keys:
                          description: |-
                            Keys are the JWK objects (inline), for example the output of
                            `kubectl get --raw /openid/v1/jwks`.
                          items:
                            x-kubernetes-preserve-unknown-fields: true
                          type: array
                          x-kubernetes-preserve-unknown-fields: true
                        type:
                          description: |-
                            Type is discovery (OIDC discovery from the issuer URL, the API default),
                            explicit_url (a fixed JWKS URL), or inline (keys given here, for
                            issuers Anthropic cannot reach, such as a private Kubernetes cluster).
                          enum:
                            - discovery
                            - explicit_url
                            - inline
                          type: string
                        url:
                          description: URL is the JWKS document URL (explicit_url).
                          type: string
