---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    anthropic.crossplane.io/sdk-version: v1.63.1
  name: agents.managedagents.anthropic.crossplane.io
spec:
  group: managedagents.anthropic.crossplane.io
  names:
    categories:
      - crossplane
      - managed
      - anthropic
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
      - agent
    singular: agent
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=='Ready')].status
          name: READY
          type: string
        - jsonPath: .status.conditions[?(@.type=='Synced')].status
          name: SYNCED
          type: string
        - jsonPath: .metadata.annotations.crossplane\.io/external-name
          name: EXTERNAL-NAME
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: AGE
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: |-
            Agent is a managed resource representing an Anthropic Managed Agent
            (beta API).
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: AgentSpec defines the desired state of Agent.
              properties:
                forProvider:
                  description: |-
                    ForProvider holds the configuration the provider reconciles against the
                    Anthropic API on every loop.
                  properties:
                    description:
                      description: Description of what the agent does. Up to 2048 characters.
                      maxLength: 2048
                      type: string
                    mcpServers:
                      description: MCPServers this agent connects to. Maximum 20. Names must be unique.
                      items:
                        description: MCPServerConfig configures a single MCP server for an agent.
                        properties:
                          name:
                            description: 'Required: Name is a unique identifier for this MCP server within the agent.'
                            type: string
                          url:
                            description: 'Required: URL is the endpoint of the MCP server.'
                            type: string
                        type: object
                      maxItems: 20
                      type: array
                    metadata:
                      additionalProperties:
                        type: string
                      description: |-
                        Metadata is arbitrary key-value data attached to the agent.
                        Maximum 16 pairs; keys up to 64 chars, values up to 512 chars.
                      type: object
                    model:
                      description: 'Required: Model is the model identifier for the agent, e.g. "claude-opus-4-7".'
                      type: string
                    modelEffort:
                      description: |-
                        ModelEffort controls how hard Claude works on each turn. Not all models
                        accept every level; invalid combinations are rejected at create time.
                      enum:
                        - low
                        - medium
                        - high
                        - xhigh
                        - max
                      type: string
                    modelInferenceGeo:
                      description: |-
                        ModelInferenceGeo is the geographic region for model inference. When
                        unset, requests fall through to the workspace's default inference geo.
                      type: string
                    multiagent:
                      description: |-
                        Multiagent configures a coordinator topology: sessions running this
                        agent orchestrate work by spawning session threads, each running an
                        agent drawn from the agents roster. Referenced agents must exist, must
                        not be archived, and must not themselves have multiagent set (depth
                        limit 1). Omit to leave any existing topology unchanged.
                      properties:
                        agents:
                          description: |-
                            Required: Agents is the roster of agents the coordinator may spawn as
                            session threads. 1–20 entries referencing distinct agents; at most one
                            "self" and at most one "advisor" entry.
                          items:
                            description: |-
                              AgentRosterEntry is a single multiagent roster entry. Type selects the
                              variant; the remaining fields belong to the variant they mention.
                            properties:
                              id:
                                description: |-
                                  ID of the referenced agent (agent variant). Populate directly or via
                                  IDRef / IDSelector.
                                type: string
                              idRef:
                                description: Reference to an Agent to populate id.
                                properties:
                                  name:
                                    description: Name of the referenced object.
                                    type: string
                                  namespace:
                                    description: Namespace of the referenced object
                                    type: string
                                  policy:
                                    description: Policies for referencing.
                                    properties:
                                      resolution:
                                        default: Required
                                        description: |-
                                          Resolution specifies whether resolution of this reference is required.
                                          The default is 'Required', which means the reconcile will fail if the
                                          reference cannot be resolved. 'Optional' means this reference will be
                                          a no-op if it cannot be resolved.
                                        enum:
                                          - Required
                                          - Optional
                                        type: string
                                      resolve:
                                        description: |-
                                          Resolve specifies when this reference should be resolved. The default
                                          is 'IfNotPresent', which will attempt to resolve the reference only when
                                          the corresponding field is not present. Use 'Always' to resolve the
                                          reference on every reconcile.
                                        enum:
                                          - Always
                                          - IfNotPresent
                                        type: string
                                    type: object
                                required:
                                  - name
                                type: object
                              idSelector:
                                description: Selector for an Agent to populate id.
                                properties:
                                  matchControllerRef:
                                    description: |-
                                      MatchControllerRef ensures an object with the same controller reference
                                      as the selecting object is selected.
                                    type: boolean
                                  matchLabels:
                                    additionalProperties:
                                      type: string
                                    description: MatchLabels ensures an object with matching labels is selected.
                                    type: object
                                  namespace:
                                    description: Namespace for the selector
                                    type: string
                                  policy:
                                    description: Policies for selection.
                                    properties:
                                      resolution:
                                        default: Required
                                        description: |-
                                          Resolution specifies whether resolution of this reference is required.
                                          The default is 'Required', which means the reconcile will fail if the
                                          reference cannot be resolved. 'Optional' means this reference will be
                                          a no-op if it cannot be resolved.
                                        enum:
                                          - Required
                                          - Optional
                                        type: string
                                      resolve:
                                        description: |-
                                          Resolve specifies when this reference should be resolved. The default
                                          is 'IfNotPresent', which will attempt to resolve the reference only when
                                          the corresponding field is not present. Use 'Always' to resolve the
                                          reference on every reconcile.
                                        enum:
                                          - Always
                                          - IfNotPresent
                                        type: string
                                    type: object
                                type: object
                              model:
                                description: |-
                                  Model is the advisor model id (advisor variant). The model must be
                                  permitted as an advisor for this agent's model.
                                type: string
                              type:
                                description: |-
                                  Required: Type of the roster entry: "agent" references another agent,
                                  "self" allows recursive self-invocation, and "advisor" adds a model the
                                  session's primary thread may consult mid-turn.
                                enum:
                                  - agent
                                  - self
                                  - advisor
                                type: string
                              version:
                                description: |-
                                  Version pins the referenced agent to a specific version (agent
                                  variant). Omit to use the latest version.
                                format: int64
                                minimum: 1
                                type: integer
                            type: object
                          maxItems: 20
                          minItems: 1
                          type: array
                      type: object
                    name:
                      description: 'Required: Name is the human-readable name for the agent (1–256 characters).'
                      maxLength: 256
                      type: string
                    skills:
                      description: Skills available to the agent. Maximum 20.
                      items:
                        description: AgentSkillConfig configures a single skill for an agent.
                        properties:
                          skillId:
                            description: |-
                              Required: SkillID is the identifier of the skill to attach.
                              Populate directly or via SkillIDRef / SkillIDSelector.
                            type: string
                          skillIdRef:
                            description: Reference to a Skill to populate skillId.
                            properties:
                              name:
                                description: Name of the referenced object.
                                type: string
                              namespace:
                                description: Namespace of the referenced object
                                type: string
                              policy:
                                description: Policies for referencing.
                                properties:
                                  resolution:
                                    default: Required
                                    description: |-
                                      Resolution specifies whether resolution of this reference is required.
                                      The default is 'Required', which means the reconcile will fail if the
                                      reference cannot be resolved. 'Optional' means this reference will be
                                      a no-op if it cannot be resolved.
                                    enum:
                                      - Required
                                      - Optional
                                    type: string
                                  resolve:
                                    description: |-
                                      Resolve specifies when this reference should be resolved. The default
                                      is 'IfNotPresent', which will attempt to resolve the reference only when
                                      the corresponding field is not present. Use 'Always' to resolve the
                                      reference on every reconcile.
                                    enum:
                                      - Always
                                      - IfNotPresent
                                    type: string
                                type: object
                            required:
                              - name
                            type: object
                          skillIdSelector:
                            description: Selector for a Skill to populate skillId.
                            properties:
                              matchControllerRef:
                                description: |-
                                  MatchControllerRef ensures an object with the same controller reference
                                  as the selecting object is selected.
                                type: boolean
                              matchLabels:
                                additionalProperties:
                                  type: string
                                description: MatchLabels ensures an object with matching labels is selected.
                                type: object
                              namespace:
                                description: Namespace for the selector
                                type: string
                              policy:
                                description: Policies for selection.
                                properties:
                                  resolution:
                                    default: Required
                                    description: |-
                                      Resolution specifies whether resolution of this reference is required.
                                      The default is 'Required', which means the reconcile will fail if the
                                      reference cannot be resolved. 'Optional' means this reference will be
                                      a no-op if it cannot be resolved.
                                    enum:
                                      - Required
                                      - Optional
                                    type: string
                                  resolve:
                                    description: |-
                                      Resolve specifies when this reference should be resolved. The default
                                      is 'IfNotPresent', which will attempt to resolve the reference only when
                                      the corresponding field is not present. Use 'Always' to resolve the
                                      reference on every reconcile.
                                    enum:
                                      - Always
                                      - IfNotPresent
                                    type: string
                                type: object
                            type: object
                          type:
                            description: 'Required: Type is either "anthropic" or "custom".'
                            enum:
                              - anthropic
                              - custom
                            type: string
                        type: object
                      maxItems: 20
                      type: array
                    systemSecretRef:
                      description: |-
                        SystemSecretRef references a Secret in the MR's namespace holding the
                        system prompt at the given key. Up to 100,000 characters; the API
                        rejects larger payloads. Omit to send no system prompt.
                      properties:
                        key:
                          type: string
                        name:
                          description: Name of the secret.
                          type: string
                      required:
                        - key
                        - name
                      type: object
                    tools:
                      description: Tools available to the agent. Maximum 128 tools across all toolsets.
                      items:
                        description: AgentToolConfig configures a single tool (toolset) for an agent.
                        properties:
                          description:
                            description: Description of the custom tool for type "custom". 1-1024 characters.
                            maxLength: 1024
                            type: string
                          inputSchema:
                            description: |-
                              InputSchema is the JSON Schema for the custom tool's input parameters.
                              Required for type "custom".
                            properties:
                              properties:
                                description: Properties defines the input parameter schemas as raw JSON values.
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                              required:
                                description: Required lists required property names.
                                items:
                                  type: string
                                type: array
                            type: object
                          mcpServerName:
                            description: |-
                              MCPServerName is the MCP server name for type "mcp_toolset".
                              Must match a server name from the mcpServers array. 1-255 characters.
                            maxLength: 255
                            type: string
                          name:
                            description: Name is the unique tool name for type "custom". 1-128 characters.
                            maxLength: 128
                            type: string
                          type:
                            description: 'Type identifies the toolset kind: "agent_toolset_20260401", "mcp_toolset", or "custom".'
                            enum:
                              - agent_toolset_20260401
                              - mcp_toolset
                              - custom
                            type: string
                        type: object
                      maxItems: 128
                      type: array
                  type: object
                managementPolicies:
                  default:
                    - '*'
                  description: |-
                    THIS IS A BETA FIELD. It is on by default but can be opted out
                    through a Crossplane feature flag.
                    ManagementPolicies specify the array of actions Crossplane is allowed to
                    take on the managed and external resources.
                    See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                    and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                  items:
                    description: |-
                      A ManagementAction represents an action that the Crossplane controllers
                      can take on an external resource.
                    enum:
                      - Observe
                      - Create
                      - Update
                      - Delete
                      - LateInitialize
                      - '*'
                    type: string
                  type: array
                providerConfigRef:
                  default:
                    kind: ClusterProviderConfig
                    name: default
                  description: |-
                    ProviderConfigReference specifies how the provider that will be used to
                    create, observe, update, and delete this managed resource should be
                    configured.
                  properties:
                    kind:
                      description: Kind of the referenced object.
                      type: string
                    name:
                      description: Name of the referenced object.
                      type: string
                  required:
                    - kind
                    - name
                  type: object
                writeConnectionSecretToRef:
                  description: |-
                    WriteConnectionSecretToReference specifies the namespace and name of a
                    Secret to which any connection details for this managed resource should
                    be written. Connection details frequently include the endpoint, username,
                    and password required to connect to the managed resource.
                  properties:
                    name:
                      description: Name of the secret.
                      type: string
                  required:
                    - name
                  type: object
              required:
                - forProvider
              type: object
            status:
              description: AgentStatus defines the observed state of Agent.
              properties:
                atProvider:
                  description: AtProvider holds the observed state as returned by the Anthropic API.
                  properties:
                    archivedAt:
                      description: ArchivedAt is set when the agent has been archived.
                      type: string
                    createdAt:
                      description: CreatedAt is the RFC 3339 timestamp when the agent was created.
                      type: string
                    description:
                      description: Description is the observed description.
                      type: string
                    id:
                      description: |-
                        ID is the Anthropic-assigned agent identifier. Also stored in the
                        external-name annotation, which the reconciler uses as the primary key.
                      type: string
                    mcpServers:
                      description: MCPServers is the observed list of MCP server configurations.
                      items:
                        description: MCPServerConfig configures a single MCP server for an agent.
                        properties:
                          name:
                            description: 'Required: Name is a unique identifier for this MCP server within the agent.'
                            type: string
                          url:
                            description: 'Required: URL is the endpoint of the MCP server.'
                            type: string
                        type: object
                      type: array
                    metadata:
                      additionalProperties:
                        type: string
                      description: Metadata is the observed key-value metadata map.
                      type: object
                    model:
                      description: Model is the observed model configuration.
                      properties:
                        id:
                          description: ID is the model identifier, e.g. "claude-opus-4-7".
                          type: string
                      type: object
                    modelEffort:
                      description: |-
                        ModelEffort is the observed effort level. Matches the top-level
                        ModelEffort key in AgentParameters (rather than nesting under Model) so
                        drift detection compares it directly against the desired value.
                      type: string
                    modelInferenceGeo:
                      description: |-
                        ModelInferenceGeo is the observed inference geo. Matches the top-level
                        ModelInferenceGeo key in AgentParameters (rather than nesting under
                        Model) so drift detection compares it directly against the desired value.
                      type: string
                    multiagent:
                      description: Multiagent is the observed coordinator topology with a resolved roster.
                      properties:
                        agents:
                          description: Agents is the resolved roster.
                          items:
                            description: AgentRosterEntryObservation is a single resolved roster entry.
                            properties:
                              id:
                                description: ID of the referenced agent.
                                type: string
                              model:
                                description: Model is the advisor model id.
                                type: string
                              type:
                                description: |-
                                  Type is "agent", "advisor", or "self" when the resolved reference
                                  points back at this agent itself. The API resolves "self" entries to
                                  concrete agent references; reporting them as "self" here keeps drift
                                  detection aligned with the desired entry.
                                type: string
                              version:
                                description: Version the reference resolved to.
                                format: int64
                                type: integer
                            type: object
                          type: array
                      type: object
                    name:
                      description: Name is the observed human-readable name.
                      type: string
                    skills:
                      description: Skills is the observed list of skill configurations.
                      items:
                        description: |-
                          AgentSkillObservation is the observed configuration of a single skill
                          attached to an agent.
                        properties:
                          skillId:
                            description: SkillID is the identifier of the attached skill.
                            type: string
                          type:
                            description: Type is either "anthropic" or "custom".
                            type: string
                        type: object
                      type: array
                    systemSha256:
                      description: |-
                        SystemSha256 is the lowercase hex SHA-256 digest of the system prompt
                        stored on the API. Used for drift detection; the raw value is never
                        stored in status. Access the system prompt via spec.writeConnectionSecretToRef.
                      type: string
                    tools:
                      description: Tools is the observed list of tool configurations.
                      items:
                        description: AgentToolConfig configures a single tool (toolset) for an agent.
                        properties:
                          description:
                            description: Description of the custom tool for type "custom". 1-1024 characters.
                            maxLength: 1024
                            type: string
                          inputSchema:
                            description: |-
                              InputSchema is the JSON Schema for the custom tool's input parameters.
                              Required for type "custom".
                            properties:
                              properties:
                                description: Properties defines the input parameter schemas as raw JSON values.
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                              required:
                                description: Required lists required property names.
                                items:
                                  type: string
                                type: array
                            type: object
                          mcpServerName:
                            description: |-
                              MCPServerName is the MCP server name for type "mcp_toolset".
                              Must match a server name from the mcpServers array. 1-255 characters.
                            maxLength: 255
                            type: string
                          name:
                            description: Name is the unique tool name for type "custom". 1-128 characters.
                            maxLength: 128
                            type: string
                          type:
                            description: 'Type identifies the toolset kind: "agent_toolset_20260401", "mcp_toolset", or "custom".'
                            enum:
                              - agent_toolset_20260401
                              - mcp_toolset
                              - custom
                            type: string
                        type: object
                      type: array
                    updatedAt:
                      description: UpdatedAt is the RFC 3339 timestamp of the last modification.
                      type: string
                    version:
                      description: |-
                        Version is incremented each time the agent is modified and is required
                        for optimistic-concurrency updates.
                      format: int64
                      type: integer
                  type: object
                conditions:
                  description: Conditions of the resource.
                  items:
                    description: A Condition that may apply to a resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          LastTransitionTime is the last time this condition transitioned from one
                          status to another.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          A Message containing details about this condition's last transition from
                          one status to another, if any.
                        type: string
                      observedGeneration:
                        description: |-
                          ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: A Reason for this condition's last transition from one status to another.
                        type: string
                      status:
                        description: Status of this condition; is it currently True, False, or Unknown?
                        type: string
                      type:
                        description: |-
                          Type of this condition. At most one of each condition type may apply to
                          a resource at any point in time.
                        type: string
                    required:
                      - lastTransitionTime
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                lastHandledReconcileAt:
                  description: |-
                    LastHandledReconcileAt holds the value of the most recent
                    reconcile-requested-at annotation token that the controller has
                    processed. Users can compare this to the annotation to determine
                    whether a reconcile request has been handled.
                  type: string
                observedGeneration:
                  description: |-
                    ObservedGeneration is the latest metadata.generation
                    which resulted in either a ready state, or stalled due to error
                    it can not recover from without human intervention.
                  format: int64
                  type: integer
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
