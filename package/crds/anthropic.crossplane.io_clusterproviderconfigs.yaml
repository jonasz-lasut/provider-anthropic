---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    anthropic.crossplane.io/sdk-version: v1.71.0
  name: clusterproviderconfigs.anthropic.crossplane.io
spec:
  group: anthropic.crossplane.io
  names:
    categories:
      - crossplane
      - provider
      - anthropic
    kind: ClusterProviderConfig
    listKind: ClusterProviderConfigList
    plural: clusterproviderconfigs
    singular: clusterproviderconfig
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .metadata.creationTimestamp
          name: AGE
          type: date
        - jsonPath: .spec.credentials.secretRef.name
          name: SECRET-NAME
          priority: 1
          type: string
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: ClusterProviderConfig configures how the provider authenticates to the Anthropic API.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                ProviderConfigSpec defines the credentials for authenticating to the
                Anthropic API.
              properties:
                credentials:
                  description: |-
                    Credentials required to authenticate to the Anthropic API. The resolved
                    credential payload must be a JSON object whose fields depend on the
                    configured identity type, e.g. {"api_key": "sk-ant-..."} for APIKey.
                  properties:
                    env:
                      description: |-
                        Env is a reference to an environment variable that contains credentials
                        that must be used to connect to the provider.
                      properties:
                        name:
                          description: Name is the name of an environment variable.
                          type: string
                      required:
                        - name
                      type: object
                    fs:
                      description: |-
                        Fs is a reference to a filesystem location that contains credentials that
                        must be used to connect to the provider.
                      properties:
                        path:
                          description: Path is a filesystem path.
                          type: string
                      required:
                        - path
                      type: object
                    secretRef:
                      description: |-
                        A SecretRef is a reference to a secret key that contains the credentials
                        that must be used to connect to the provider.
                      properties:
                        key:
                          description: The key to select.
                          type: string
                        name:
                          description: Name of the secret.
                          type: string
                        namespace:
                          description: Namespace of the secret.
                          type: string
                      required:
                        - key
                        - name
                        - namespace
                      type: object
                    source:
                      description: Source of the credentials.
                      enum:
                        - None
                        - Secret
                        - InjectedIdentity
                        - Environment
                        - Filesystem
                      type: string
                  required:
                    - source
                  type: object
                identity:
                  description: Identity specifies how the provider authenticates to the Anthropic API.
                  properties:
                    federation:
                      description: |-
                        Federation configures the WorkloadIdentityFederation identity. Required
                        for that type and ignored for the others.
                      properties:
                        federationRuleID:
                          description: |-
                            FederationRuleID is the federation rule (fdrl_...) whose issuer trusts
                            the cluster's ServiceAccount tokens and whose target decides the role
                            and scope of the minted access tokens.
                          pattern: ^fdrl_[A-Za-z0-9]+$
                          type: string
                        organizationID:
                          description: |-
                            OrganizationID is the UUID of the Anthropic organization the federation
                            rule belongs to (the id returned by GET /v1/organizations/me).
                          minLength: 1
                          type: string
                        serviceAccountID:
                          description: |-
                            ServiceAccountID is an optional expected-target check (svac_...) for
                            rules that target a service account; the exchange fails if the rule
                            targets a different account.
                          pattern: ^svac_[A-Za-z0-9]+$
                          type: string
                        tokenFile:
                          default: /var/run/secrets/anthropic/token
                          description: |-
                            TokenFile is the path of the identity token inside the provider pod,
                            normally a projected ServiceAccount token volume that the
                            DeploymentRuntimeConfig mounts with the audience the federation rule
                            expects; the kubelet rotates it and every exchange reads it fresh.
                          type: string
                      required:
                        - federationRuleID
                        - organizationID
                      type: object
                    type:
                      description: |-
                        Type of identity used to authenticate to the Anthropic API.
                        APIKey: a static API key read from the "api_key" field of the JSON
                        credentials payload (regular, organization-scoped, or Admin API key).
                        WorkloadIdentityFederation: short-lived access tokens exchanged from a
                        projected Kubernetes ServiceAccount token through the federation rule
                        in spec.identity.federation; the only identity accepted by the Admin
                        API's service-account and federation endpoints.
                      enum:
                        - APIKey
                        - WorkloadIdentityFederation
                      type: string
                  required:
                    - type
                  type: object
                  x-kubernetes-validations:
                    - message: spec.identity.federation is required when type is WorkloadIdentityFederation
                      rule: self.type != 'WorkloadIdentityFederation' || has(self.federation)
                workspaceID:
                  description: |-
                    WorkspaceID selects the Anthropic workspace that every request made
                    through this ProviderConfig runs in, sent as the anthropic-workspace-id
                    header. Only multi-workspace personal or service-account API keys honour
                    it; a key bound to a single workspace always runs there. Accepts a
                    wrkspc_ prefixed workspace ID or the literal "default" for the
                    organization's Default Workspace. Changing it re-targets every managed
                    resource using this ProviderConfig to the new workspace, where their
                    external names do not exist.
                  pattern: ^(wrkspc_[A-Za-z0-9]+|default)$
                  type: string
              required:
                - credentials
                - identity
              type: object
            status:
              description: ProviderConfigStatus represents the observed state of a ProviderConfig.
              properties:
                conditions:
                  description: Conditions of the resource.
                  items:
                    description: A Condition that may apply to a resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          LastTransitionTime is the last time this condition transitioned from one
                          status to another.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          A Message containing details about this condition's last transition from
                          one status to another, if any.
                        type: string
                      observedGeneration:
                        description: |-
                          ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: A Reason for this condition's last transition from one status to another.
                        type: string
                      status:
                        description: Status of this condition; is it currently True, False, or Unknown?
                        type: string
                      type:
                        description: |-
                          Type of this condition. At most one of each condition type may apply to
                          a resource at any point in time.
                        type: string
                    required:
                      - lastTransitionTime
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                users:
                  description: Users of this provider configuration.
                  format: int64
                  type: integer
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
