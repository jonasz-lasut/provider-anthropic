kind: CustomResourceDefinition
metadata:
  annotations:
    anthropic.crossplane.io/sdk-version: v1.71.0
  name: invites.organization.anthropic.crossplane.io
spec:
  group: organization.anthropic.crossplane.io
  names:
    categories:
      - crossplane
      - managed
      - anthropic
    kind: Invite
    listKind: InviteList
    plural: invites
    shortNames:
      - orginvite
    singular: invite
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=='Ready')].status
          name: READY
          type: string
        - jsonPath: .status.conditions[?(@.type=='Synced')].status
          name: SYNCED
          type: string
        - jsonPath: .metadata.annotations.crossplane\.io/external-name
          name: EXTERNAL-NAME
          type: string
        - jsonPath: .status.atProvider.status
          name: STATUS
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: AGE
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: |-
            Invite is a managed resource representing an invitation of a user into an
            Anthropic organization (Admin API). Creating it emails the invitee;
            deleting it revokes a pending invite. Requires a ProviderConfig backed by
            an Admin API key.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: InviteSpec defines the desired state of Invite.
              properties:
                forProvider:
                  description: |-
                    ForProvider holds the configuration the provider reconciles against the
                    Anthropic API on every loop.
                  properties:
                    email:
                      description: |-
                        Required: Email of the user to invite. Sending the invite emails this
                        address. Immutable after creation.
                      type: string
                    rbacGroupIds:
                      description: |-
                        RBACGroupIDs are assigned to the user when the invite is accepted. Only
                        accepted by Claude Enterprise organizations with RBAC groups.
                      items:
                        type: string
                      type: array
                    role:
                      description: |-
                        Required: Role the invited user receives. Console and API organizations
                        accept user, developer, billing, and claude_code_user; Claude Enterprise
                        organizations accept user and managed. admin cannot be assigned through
                        the API. Immutable after creation.
                      enum:
                        - user
                        - developer
                        - billing
                        - claude_code_user
                        - managed
                      type: string
                  type: object
                managementPolicies:
                  default:
                    - '*'
                  description: |-
                    THIS IS A BETA FIELD. It is on by default but can be opted out
                    through a Crossplane feature flag.
                    ManagementPolicies specify the array of actions Crossplane is allowed to
                    take on the managed and external resources.
                    See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                    and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                  items:
                    description: |-
                      A ManagementAction represents an action that the Crossplane controllers
                      can take on an external resource.
                    enum:
                      - Observe
                      - Create
                      - Update
                      - Delete
                      - LateInitialize
                      - '*'
                    type: string
                  type: array
                providerConfigRef:
                  default:
                    kind: ClusterProviderConfig
                    name: default
                  description: |-
                    ProviderConfigReference specifies how the provider that will be used to
                    create, observe, update, and delete this managed resource should be
                    configured.
                  properties:
                    kind:
                      description: Kind of the referenced object.
                      type: string
                    name:
                      description: Name of the referenced object.
                      type: string
                  required:
                    - kind
                    - name
                  type: object
                writeConnectionSecretToRef:
                  description: |-
                    WriteConnectionSecretToReference specifies the namespace and name of a
                    Secret to which any connection details for this managed resource should
                    be written. Connection details frequently include the endpoint, username,
                    and password required to connect to the managed resource.
                  properties:
                    name:
                      description: Name of the secret.
                      type: string
                  required:
                    - name
                  type: object
              required:
                - forProvider
              type: object
            status:
              description: InviteStatus defines the observed state of Invite.
              properties:
                atProvider:
                  description: AtProvider holds the observed state as returned by the Anthropic API.
                  properties:
                    acceptedAt:
                      description: |-
                        AcceptedAt is the RFC 3339 timestamp when the invite was accepted, if
                        it was.
                      type: string
                    email:
                      description: Email is the invited address.
                      type: string
                    expiresAt:
                      description: ExpiresAt is the RFC 3339 timestamp when the invite expires.
                      type: string
                    id:
                      description: |-
                        ID is the Anthropic-assigned invite identifier (invite_...). Also
                        stored in the external-name annotation, which the reconciler uses as
                        the primary key.
                      type: string
                    invitedAt:
                      description: InvitedAt is the RFC 3339 timestamp when the invite was sent.
                      type: string
                    rbacGroupIds:
                      description: RBACGroupIDs are the groups assigned on acceptance.
                      items:
                        type: string
                      type: array
                    role:
                      description: Role is the role the invite grants.
                      type: string
                    status:
                      description: Status is pending, accepted, expired, or deleted.
                      type: string
                  type: object
                conditions:
                  description: Conditions of the resource.
                  items:
                    description: A Condition that may apply to a resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          LastTransitionTime is the last time this condition transitioned from one
                          status to another.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          A Message containing details about this condition's last transition from
                          one status to another, if any.
                        type: string
                      observedGeneration:
                        description: |-
                          ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: A Reason for this condition's last transition from one status to another.
                        type: string
                      status:
                        description: Status of this condition; is it currently True, False, or Unknown?
                        type: string
                      type:
                        description: |-
                          Type of this condition. At most one of each condition type may apply to
                          a resource at any point in time.
                        type: string
                    required:
                      - lastTransitionTime
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                lastHandledReconcileAt:
                  description: |-
                    LastHandledReconcileAt holds the value of the most recent
                    reconcile-requested-at annotation token that the controller has
                    processed. Users can compare this to the annotation to determine
                    whether a reconcile request has been handled.
                  type: string
                observedGeneration:
                  description: |-
                    ObservedGeneration is the latest metadata.generation
                    which resulted in either a ready state, or stalled due to error
                    it can not recover from without human intervention.
                  format: int64
                  type: integer
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
