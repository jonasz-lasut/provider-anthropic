---
# ClusterProviderConfig for the Admin API resources (organization.anthropic.crossplane.io).
# The credential is an Admin API key (sk-ant-admin...), which every
# organization endpoint requires and which cannot call the Messages or Managed
# Agents APIs, so keep it in its own ProviderConfig.
apiVersion: anthropic.crossplane.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: admin
  labels:
    testing.upbound.io/example-name: admin
  annotations:
    meta.upbound.io/example-id: anthropic/v1beta1/clusterproviderconfig-admin
spec:
  credentials:
    source: Secret
    secretRef:
      name: anthropic-admin-credentials
      namespace: crossplane-system
      key: credentials
  identity:
    type: APIKey
---
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-admin-credentials
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: |
    {
      "api_key": "REPLACE_WITH_ANTHROPIC_ADMIN_API_KEY"
    }
