---
apiVersion: anthropic.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: example-providerconfig
  namespace: crossplane-system
  labels:
    testing.upbound.io/example-name: example
  annotations:
    meta.upbound.io/example-id: anthropic/v1beta1/providerconfig
spec:
  credentials:
    source: Secret
    secretRef:
      name: anthropic-credentials
      namespace: crossplane-system
      key: credentials
  identity:
    type: APIKey
  # Optional: scope every request to one workspace; only multi-workspace API keys honour it.
  # workspaceID: wrkspc_01JwQvzr7rXLA5AGx3HKfFUJ
---
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-credentials
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: |
    {
      "api_key": "REPLACE_WITH_ANTHROPIC_API_KEY"
    }
