---
apiVersion: organization.anthropic.crossplane.io/v1beta1
kind: ServiceAccount
metadata:
  name: example-service-account
  namespace: crossplane-system
  labels:
    testing.upbound.io/example-name: example
  annotations:
    meta.upbound.io/example-id: organization/v1beta1/serviceaccount
spec:
  # The service-account endpoints accept only org:admin OAuth tokens, so this
  # needs a ProviderConfig with the WorkloadIdentityFederation identity.
  providerConfigRef:
    kind: ClusterProviderConfig
    name: admin-federation
  forProvider:
    name: crossplane-example-${Rand.RFC1123Subdomain}
    description: Created by the provider-anthropic example
    organizationRole: developer
