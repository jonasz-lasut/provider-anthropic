---
apiVersion: organization.anthropic.crossplane.io/v1beta1
kind: Workspace
metadata:
  name: example-workspace
  namespace: crossplane-system
  labels:
    testing.upbound.io/example-name: example
  annotations:
    meta.upbound.io/example-id: organization/v1beta1/workspace
spec:
  # Admin API resources need a ProviderConfig backed by an Admin API key
  # (sk-ant-admin...), which cannot be shared with the managed-agents resources.
  providerConfigRef:
    kind: ClusterProviderConfig
    name: admin
  forProvider:
    name: crossplane-example-workspace
    tags:
      example: "true"
    dataResidency:
      workspaceGeo: us
      allowedInferenceGeos:
        - unrestricted
      defaultInferenceGeo: global
